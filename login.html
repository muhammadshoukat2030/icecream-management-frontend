<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">

  <title>FrostyOps — Login</title>

  <style>
    :root {
      --indigo-900: #2c2478;
      --indigo-800: #332a8c;
      --indigo-700: #4338ca;
      --indigo-600: #4f46e5;
      --indigo-500: #5d54e8;
      
      --ink: #1c1a33;
      --muted: #6b6b85;
      --line: #e7e7ef;
      --bg: #f3f3f8;
      
      --green: #16a34a;
      --red: #e0384c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f3f3f8 0%, #e5e5f2 50%, #f3f3f8 100%);
      font-family: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding: 20px;
      min-height: 100vh;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 15px 50px rgba(20, 20, 50, 0.15),
                  0 0 1px rgba(20, 20, 50, 0.1);
      border: 1px solid rgba(79, 70, 229, 0.1);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-container {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 60px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .brand-text {
      margin-top: 16px;
    }

    h1 {
      text-align: center;
      color: var(--ink);
      margin-bottom: 6px;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 32px;
      font-size: 14px;
      font-weight: 500;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-weight: 600;
      font-size: 14px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      color: var(--ink);
      background: white;
      outline: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--indigo-600);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
      background: #fafbff;
    }

    input::placeholder {
      color: var(--muted);
    }

    .login-btn {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--indigo-600), var(--indigo-700));
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 48px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, var(--indigo-700), var(--indigo-800));
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.4);
    }

    .login-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .login-btn:disabled {
      background: var(--line);
      color: var(--muted);
      cursor: not-allowed;
      box-shadow: none;
      opacity: 0.6;
    }

    .message {
      margin-bottom: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      display: none;
      font-size: 14px;
      font-weight: 500;
      border-left: 4px solid;
      animation: slideDown 0.3s ease-out;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.error {
      display: block;
      background: #fdeaec;
      color: var(--red);
      border-color: var(--red);
    }

    .message.success {
      display: block;
      background: #e9f9ee;
      color: var(--green);
      border-color: var(--green);
    }

    .footer {
      text-align: center;
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .login-container {
        padding: 32px 20px;
        border-radius: 16px;
      }

      h1 {
        font-size: 24px;
        margin-bottom: 4px;
      }

      .subtitle {
        font-size: 13px;
        margin-bottom: 24px;
      }

      .logo {
        font-size: 48px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        font-size: 13px;
        margin-bottom: 6px;
      }

      input[type="email"],
      input[type="password"] {
        padding: 11px 12px;
        font-size: 14px;
        border-radius: 8px;
      }

      .login-btn {
        padding: 12px 14px;
        font-size: 14px;
        min-height: 44px;
      }
    }

    @media (max-width: 375px) {
      body {
        padding: 16px;
      }

      .login-container {
        padding: 28px 16px;
      }

      h1 {
        font-size: 22px;
      }

      .logo {
        font-size: 44px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo-container">
      <div class="logo">🍦</div>
      <div class="brand-text">
        <div style="font-weight: 700; color: var(--indigo-600); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; margin-top: 8px;">FrostyOps</div>
      </div>
    </div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Ice Cream Distribution Management System
    </p>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginButton"
      >
        Sign In
      </button>

    </form>

    <div class="footer">
      © 2024-2026 FrostyOps Ice Cream Distribution System
    </div>

  </div>


  <script>
 

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className = "message " + type;

    }
// const API = "https://icecream-management-opal.vercel.app";

const API = "https://ice-cream-management.vercel.app";

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password = document
        .getElementById("password")
        .value;

    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    try {

        const response = await fetch(
            `${API}/login`,
            {
                method: "POST",
                credentials: "include",
                headers: {
                    "Content-Type": "application/json"
                },

                

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            showMessage(
                data.message || "Invalid email or password.",
                "error"
            );

            return;
        }

        showMessage(
            "Login successful! Redirecting...",
            "success"
        );

        const response2 = await fetch(
            `${API}/getMe`,
            {
                credentials: "include"
            }
        );

        const data2 = await response2.json();

        localStorage.setItem(
            "user",
            JSON.stringify(data2)
        );

        setTimeout(() => {

            window.location.href = "./index.html";

        }, 1000);

    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to connect to the server.",
            "error"
        );

    } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Login";

    }

});
  </script>

</body>
</html>
