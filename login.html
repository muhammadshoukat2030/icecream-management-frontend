<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IceCream Distribution - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fff1f5, #dff5ff);
    }

    .login-container {
      width: 400px;
      max-width: 90%;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 55px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #444;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #ff6b9a;
      box-shadow: 0 0 0 3px rgba(255, 107, 154, 0.12);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ff6b9a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #f34f83;
    }

    .login-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .message {
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 14px;
    }

    .error {
      display: block;
      background: #ffe5e5;
      color: #c62828;
    }

    .success {
      display: block;
      background: #e5f8ed;
      color: #18864b;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #888;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">🍦</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Ice Cream Distribution Management
    </p>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginButton"
      >
        Login
      </button>

    </form>

    <div class="footer">
      © 2026 Ice Cream Distribution System
    </div>

  </div>


  <script>
 

    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className = "message " + type;

    }


const API = "https://ice-cream-management.vercel.app";

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document
        .getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password = document
        .getElementById("password")
        .value;

    if (!email || !password) {

        showMessage(
            "Please enter your email and password.",
            "error"
        );

        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "Logging in...";

    try {

        const response = await fetch(
            `${API}/login`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {

            showMessage(
                data.message || "Invalid email or password.",
                "error"
            );

            return;
        }

        showMessage(
            "Login successful! Redirecting...",
            "success"
        );

        const response2 = await fetch(
            `${API}/getMe`,
            {
                credentials: "include"
            }
        );

        const data2 = await response2.json();

        localStorage.setItem(
            "user",
            JSON.stringify(data2)
        );

        setTimeout(() => {

            window.location.href = "./index.html";

        }, 1000);

    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to connect to the server.",
            "error"
        );

    } finally {

        loginButton.disabled = false;
        loginButton.textContent = "Login";

    }

});
  </script>

</body>
</html>
