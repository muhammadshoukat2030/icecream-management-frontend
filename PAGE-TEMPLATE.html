<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#4f46e5">

    <title>PAGE_TITLE — FrostyOps</title>

    <!-- IMPORTANT: Always include shared-layout.css FIRST -->
    <link rel="stylesheet" href="shared-layout.css">
    
    <!-- Then include page-specific CSS -->
    <link rel="stylesheet" href="PAGE_FILENAME.css">
</head>

<body>

    <!-- Sidebar Overlay (for mobile) -->
    <div class="overlay" id="overlay"></div>

    <!-- Main Shell -->
    <div class="shell">

        <!-- ================= SIDEBAR ================= -->
        <!-- This sidebar is reused across all pages -->
        
        <aside class="sidebar" id="sidebar">

            <!-- Brand Section -->
            <div class="brand">
                <div class="brand-badge">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 7l9-4 9 4-9 4-9-4z" />
                        <path d="M3 12l9 4 9-4" />
                        <path d="M3 17l9 4 9-4" />
                    </svg>
                </div>
                <div>
                    <div class="brand-name">FrostyOps</div>
                    <div class="brand-sub">Ice cream distribution</div>
                </div>
            </div>

            <!-- Navigation Menu -->
            <nav class="navlist">

                <a class="navlink" href="index.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 11l9-8 9 8" />
                        <path d="M5 10v10h14V10" />
                    </svg>
                    Dashboard
                </a>

                <a class="navlink" href="Categories.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="8" height="8" rx="1.5" />
                        <rect x="13" y="3" width="8" height="8" rx="1.5" />
                        <rect x="3" y="13" width="8" height="8" rx="1.5" />
                        <rect x="13" y="13" width="8" height="8" rx="1.5" />
                    </svg>
                    Categories
                </a>

                <a class="navlink" href="Products.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 8l-9-5-9 5 9 5 9-5z" />
                        <path d="M3 8v8l9 5 9-5V8" />
                        <path d="M12 13v8" />
                    </svg>
                    Products
                </a>

                <a class="navlink" href="Salesmen.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="8" r="4" />
                        <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" />
                    </svg>
                    Salesmen
                </a>

                <a class="navlink" href="suppliers.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="8" cy="9" r="3" />
                        <circle cx="17" cy="9" r="3" />
                        <path d="M2 21c0-3.5 2.7-6 6-6s6 2.5 6 6" />
                        <path d="M11 21c0-3 2.4-5.5 5.5-5.5S22 18 22 21" />
                    </svg>
                    Suppliers
                </a>

                <a class="navlink" href="purchase-stocks.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.6 7.5L12 12l-8.6-4.5" />
                        <path d="M12 12v9" />
                        <path d="M20.6 16.5L12 21l-8.6-4.5V7.5L12 3l8.6 4.5v9z" />
                    </svg>
                    Purchase Stocks
                </a>

                <a class="navlink" href="issueStocks.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="1" y="7" width="14" height="10" rx="1" />
                        <path d="M15 10h3l4 4v3h-7" />
                        <circle cx="6" cy="19" r="1.6" />
                        <circle cx="17.5" cy="19" r="1.6" />
                    </svg>
                    Issue Stocks
                </a>

                <a class="navlink" href="stockInventory.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4v5h5" />
                        <path d="M4.6 15a8 8 0 1 0 2-9.4L4 9" />
                    </svg>
                    Stock Inventory
                </a>

                <div class="navdivider"></div>

                <a class="navlink" href="settings.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1A1.6 1.6 0 004.6 9a1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9c.4.3.9.5 1.5.5H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z" />
                    </svg>
                    Settings
                </a>

            </nav>

        </aside>

        <!-- ================= MAIN CONTENT ================= -->

        <div class="main">

            <!-- TOP BAR / HEADER -->
            <div class="topbar">
                <div class="topbar-left">
                    <!-- Hamburger menu button (mobile only) -->
                    <button class="hamburger" id="hamburgerBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 6h16" />
                            <path d="M4 12h16" />
                            <path d="M4 18h16" />
                        </svg>
                    </button>

                    <!-- Page title / Breadcrumb -->
                    <div class="crumb">PAGE_TITLE</div>
                </div>

                <!-- Right side of header -->
                <div class="topbar-right">
                    <!-- Date pill -->
                    <div class="pill">
                        <span class="pill-text" id="currentDate">Loading...</span>
                    </div>

                    <!-- Admin profile pill -->
                    <div class="pill admin">
                        <span class="avatar-dot"></span>
                        <span class="pill-text" id="admin">Admin</span>
                    </div>
                </div>
            </div>

            <!-- PAGE CONTENT -->
            <div class="page">
                <div class="content">
                    
                    <!-- ================= EXAMPLE: STAT CARDS ================= -->
                    <div class="stat-row">
                        <div class="stat-card">
                            <div class="stat-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 8l-9-5-9 5 9 5 9-5z" />
                                    <path d="M3 8v8l9 5 9-5V8" />
                                    <path d="M12 13v8" />
                                </svg>
                            </div>
                            <div>
                                <div class="stat-title">Stat Title</div>
                                <div class="stat-num">0</div>
                                <div class="stat-sub">Subtitle</div>
                            </div>
                        </div>
                    </div>

                    <!-- ================= EXAMPLE: TABLE ================= -->
                    <div class="card">
                        <div class="table-head">
                            <h2>Table Title</h2>
                            <button class="btn-add">View All</button>
                        </div>

                        <div class="table-scroll">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Column 1</th>
                                        <th>Column 2</th>
                                        <th>Column 3</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="tableBody">
                                    <!-- Data loaded from JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- ================= EXAMPLE: FORM ================= -->
                    <div class="card" style="max-width: 600px; margin-top: 24px;">
                        <div class="table-head">
                            <h2>Form Title</h2>
                        </div>

                        <form id="exampleForm" style="padding: 24px;">
                            <div class="form-group">
                                <label for="fieldName">Field Name</label>
                                <input 
                                    type="text" 
                                    id="fieldName" 
                                    name="fieldName" 
                                    placeholder="Enter value"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="fieldEmail">Email</label>
                                <input 
                                    type="email" 
                                    id="fieldEmail" 
                                    name="fieldEmail" 
                                    placeholder="example@domain.com"
                                    required
                                >
                            </div>

                            <div class="form-group">
                                <label for="fieldCategory">Category</label>
                                <select id="fieldCategory" name="fieldCategory" required>
                                    <option value="">Select an option</option>
                                    <option value="option1">Option 1</option>
                                    <option value="option2">Option 2</option>
                                </select>
                            </div>

                            <div style="display: flex; gap: 12px; margin-top: 24px;">
                                <button type="submit" class="btn btn-primary">Submit</button>
                                <button type="button" class="btn btn-secondary">Cancel</button>
                            </div>
                        </form>
                    </div>

                </div>
            </div>

        </div>

    </div>

    <!-- ================= SCRIPTS ================= -->
    <!-- IMPORTANT: Load shared-layout.js BEFORE your page script -->
    <script src="shared-layout.js"></script>
    
    <!-- Load page-specific script -->
    <script src="PAGE_FILENAME.js"></script>

    <!-- Optional: Initialize page title -->
    <script>
        // Called after shared-layout.js is loaded
        if (window.layout) {
            window.layout.setPageTitle('PAGE_TITLE');
        }
    </script>

</body>

</html>

<!-- 
===============================
HOW TO USE THIS TEMPLATE
===============================

1. Replace all "PAGE_TITLE" with your actual page title
2. Replace all "PAGE_FILENAME" with your actual filename (without extension)
3. Copy this structure to each page you need to update
4. Create page-specific CSS file with only page-specific styles
5. Ensure shared-layout.css is ALWAYS linked first
6. Load shared-layout.js BEFORE your page script
7. Test on mobile, tablet, and desktop

IMPORTANT NOTES:
- Keep all existing IDs (id="sidebar", id="overlay", id="hamburgerBtn", etc.)
- Keep all existing classes
- Don't modify the sidebar navigation structure
- The sidebar is now reused across all pages
- All layout is handled by shared-layout.css
- Your page CSS should only contain page-specific styles

EXAMPLE FILENAMES:
- Products.html → Products.css, products.js
- Categories.html → Categories.css, Categories.js
- Salesmen.html → Salesmen.css, salesmen.js
- suppliers.html → suppliers.css, suppliers.js
- purchase-stocks.html → purchase-stocks.css, Purchase-stocks.js
- issueStocks.html → issueStocks.css, issueStocks.js
- stockInventory.html → stockInventory.css, stockInventory.js
- settings.html → settings.css, (no js needed usually)

-->
